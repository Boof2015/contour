name: Build installer

on:
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: Also create a draft release (never publishes)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Test and package
    runs-on: windows-2025
    timeout-minutes: 35
    outputs:
      version: ${{ steps.build.outputs.version }}
      artifact-name: Contour-${{ steps.build.outputs.version }}-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build, test, and package
        id: build
        shell: powershell
        run: ./tools/ci/build.ps1 -Installer
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Contour-${{ steps.build.outputs.version }}-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.build.outputs.artifact-directory }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  draft:
    name: Create draft (never publish)
    if: ${{ inputs.create_draft_release }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Serialize drafts for the same version; an existing release is never replaced.
    concurrency:
      group: contour-draft-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: installer-artifact
      - name: Attach installer to a new draft
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const createDraft = require('./tools/ci/create-draft.cjs');
            await createDraft({ github, context, core, directory: 'installer-artifact' });
